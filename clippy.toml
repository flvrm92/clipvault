# Test code may unwrap/expect/panic (specs/02 REL-004 applies to production code only).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
doc-valid-idents = ["ClipVault", "SQLite", "WebView2", "TypeScript", ".."]
