[workspace]
resolver = "3"
members = ["crates/*", "app", "xtask", "tools/gen-assets"]
default-members = ["crates/*", "app", "xtask"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
# Layer crates — dependency rule: specs/03 §1, enforced by `cargo xtask check-arch`.
clipvault-domain = { path = "crates/domain" }
clipvault-application = { path = "crates/application" }
clipvault-infrastructure = { path = "crates/infrastructure" }
clipvault-test-support = { path = "crates/test-support" }

# specs/02 REL-004 · MNT-002
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# gen-assets rasterizes up to 3840×2160 in tests and in `--check`: optimize the graphics crates
# even in dev builds.
[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3
