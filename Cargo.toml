[workspace]
resolver = "3"
members = ["crates/*", "app", "xtask"]
default-members = ["crates/*", "app", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
# Layer crates are declared here (e.g. `clipvault-domain = { path = "crates/domain" }`)
# when first used, respecting the dependency rule (specs/03 §1, enforced by `cargo xtask check-arch`).

# specs/02 REL-004 · MNT-002
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
