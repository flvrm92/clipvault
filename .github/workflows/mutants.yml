# Weekly mutation testing of the core layers — specs/08 §5 (goal: ≥ 80% of mutants killed).
name: Mutation testing

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: cargo mutants --package clipvault-domain --package clipvault-application --no-shuffle
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out
