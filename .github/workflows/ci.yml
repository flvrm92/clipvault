# Continuous integration — specs/08-estrategia-de-testes.md §6
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust · lint, test, architecture, traceability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The release tags tell check-version which versions were already published (MNT-006).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app crate embeds ui/dist at compile time (tauri::generate_context!).
      - run: pnpm --filter clipvault-ui build
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # ts-rs regenerates the UI bindings during the tests; committed files must match.
      - name: UI bindings are up to date
        shell: bash
        run: test -z "$(git status --porcelain -- ui/src/api/bindings)" || (git status -- ui/src/api/bindings && exit 1)
      # Win32 integration tests against the real clipboard (ignored locally by default).
      - run: cargo test -p clipvault-infrastructure --test win32_clipboard --locked -- --ignored --test-threads=1
      # Separate binary: it must own the foreground window (see the file docs).
      - run: cargo test -p clipvault-infrastructure --test win32_paste --locked -- --ignored
      - run: cargo test -p clipvault-infrastructure --test win32_hotkeys --locked -- --ignored
      - run: cargo xtask check-arch
      - run: cargo xtask trace-reqs
      - run: cargo xtask check-version
      # Brand assets are generated from the master SVGs and committed (specs/07 §6).
      - run: cargo run -p gen-assets --locked -- --check

  coverage:
    name: Rust · coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter clipvault-ui build
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Avoid stale instrumented binaries restored from the cache.
      - run: cargo llvm-cov clean --workspace
      # Per-layer minimums (specs/08 §5).
      - run: cargo llvm-cov -p clipvault-domain --locked --summary-only --fail-under-lines 95
      - run: cargo llvm-cov -p clipvault-application --locked --summary-only --fail-under-lines 90
      - run: cargo llvm-cov -p clipvault-infrastructure --locked --summary-only --ignore-filename-regex "win32" --fail-under-lines 85
      # Win32 adapters, measured with their unit tests plus the ignored real-clipboard tests
      # (specs/08 §5: ≥ 60%). The lib has no ignored tests, so --include-ignored only adds the Win32 ones.
      - run: >-
          cargo llvm-cov -p clipvault-infrastructure --lib --test win32_clipboard --test win32_paste --test win32_hotkeys --locked --summary-only
          --ignore-filename-regex "crates[\\/](domain|application|test-support)[\\/]|infrastructure[\\/]src[\\/](sqlite|images|dib|retry|clock|lib\.rs)"
          --fail-under-lines 60 -- --include-ignored --test-threads=1
      # The composition root (app) is covered by E2E tests, not by line coverage (specs/08 §5).
      - run: cargo llvm-cov --workspace --exclude clipvault-app --locked --ignore-filename-regex "win32" --fail-under-lines 85 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info

  ui:
    name: UI · lint, typecheck, test, coverage
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm coverage
      - run: pnpm build

  audit:
    name: Supply chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Nothing is installed here, so there is no pnpm store to cache; v5 caches by default
          # when package.json declares `packageManager`, and fails saving a missing path.
          package-manager-cache: false
      - run: pnpm audit --prod

  # Dry run of the MSIX packaging (specs/09 §5): x64 only, unsigned, nothing published.
  # The full x64 + arm64 build runs in release.yml on version tags.
  package:
    name: MSIX · package dry run (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc
      - run: packaging/msix/build.ps1 -Version 0.0.1 -Arch x64
        shell: pwsh

  # Added in later milestones (specs/10):
  # - e2e (M4+, nightly/release): tauri-driver + WebdriverIO against the packaged app
