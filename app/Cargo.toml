[package]
name = "clipvault-app"
description = "ClipVault — clipboard manager for Windows (Tauri composition root)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "clipvault_app"
path = "src/lib.rs"

[[bin]]
name = "ClipVault"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clipvault-domain.workspace = true
clipvault-application.workspace = true
clipvault-infrastructure.workspace = true
tauri = { version = "2.12.7", features = ["tray-icon"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tracing = "0.1.44"
thiserror = "2.0.21"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }
