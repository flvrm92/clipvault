[package]
name = "clipvault-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clipvault-domain.workspace = true
clipvault-application.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
tracing = "0.1.44"
thiserror = "2.0.21"

[dev-dependencies]
clipvault-test-support.workspace = true
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_Storage_Packaging_Appx", "ApplicationModel"] }
